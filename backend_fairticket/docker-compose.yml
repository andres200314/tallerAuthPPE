services:
  postgres:
    image: postgres:17-alpine
    container_name: fairticket-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fairticket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    volumes:
      - fairticket-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: fairticket-app
    ports:
      - "6001:6001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fairticket
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: mysecretpassword
    depends_on:
      - postgres

volumes:
  fairticket-data: